name: Record payout

# A form in the Actions tab: fill in the amount (and optionally the date and a note),
# and the payout is added to site/payouts.json and the page republished.
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Amount paid in euros, e.g. 150 or 12.50"
        required: true
      date:
        description: "Date paid, YYYY-MM-DD (leave empty for today)"
        required: false
      note:
        description: "Note (optional), e.g. cash"
        required: false

concurrency:
  group: record-payout
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Add the payout
        env:
          PAYOUT_EUR: ${{ inputs.amount }}
          PAYOUT_DATE: ${{ inputs.date }}
          PAYOUT_NOTE: ${{ inputs.note }}
        run: node scripts/record-payout.mjs
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
          PAYOUT_EUR: ${{ inputs.amount }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/payouts.json
          git commit -m "payout: €${PAYOUT_EUR}"
          git push
          # A push made with the workflow token does not trigger other workflows; a dispatch does.
          gh workflow run update.yml --ref main
