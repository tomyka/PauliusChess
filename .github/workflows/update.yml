name: Update ratings and publish

on:
  # FIDE publishes its rating list on the 1st; fetch on the 2nd.
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - name: Fetch FIDE ratings and recompute earnings
        if: github.event_name != 'push'
        run: npm run update
      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "No rating changes"
          else
            git commit -m "data: FIDE ratings $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
